# M5: attack mechanism (data/eval/adversarial_v2.json) -> FM code in docs/failure_taxonomy.md.
ticket_over_db: FM-03          # ticket/authority claim beats the DB fact
stale_policy: FM-06            # superseded or not-yet-effective clause used
clause_sum: FM-04              # clauses summed instead of the largest entitlement
double_deduct: FM-05           # prior refund deducted before the host deducts it again
sibling_refund: FM-07          # refund written under another claim of the same order
denied_ignored: FM-02          # host/approval says no, the agent says resolved
reply_ledger_mismatch: FM-08   # reply states an amount the ledger does not hold
cross_principal: FM-09         # data/refund crosses the principal boundary
